[package]
name = "wmapp-fips-android"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fips = { git = "https://github.com/jmcorgan/fips.git", rev = "80f8f965aa872296edbce84ade9949ece2596602" }
jni = "0.21"
libc = "0.2"
serde_json = "1"
serde_yaml = "0.9"
simple-dns = "0.11.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
