<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nostr Browser Signer Test</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 32px;
        background: #f5f6f3;
        color: #17201c;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 680;
      }

      p {
        line-height: 1.5;
      }

      label {
        display: block;
        margin: 20px 0 8px;
        font-weight: 620;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #b8c2bb;
        border-radius: 6px;
        font: inherit;
        background: #ffffff;
        color: #17201c;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 20px 0;
      }

      button {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid #286a5a;
        border-radius: 6px;
        background: #286a5a;
        color: #ffffff;
        font: inherit;
        font-weight: 620;
        cursor: pointer;
      }

      button.secondary {
        background: transparent;
        color: #286a5a;
      }

      pre {
        min-height: 180px;
        margin: 0;
        padding: 16px;
        overflow: auto;
        border: 1px solid #c8d0ca;
        border-radius: 6px;
        background: #ffffff;
        color: #17201c;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nostr Browser Signer Test</h1>
      <p>
        Load this page inside the native Nostr Browser. A trusted origin
        should receive <code>window.nostr</code>; a normal browser should not.
      </p>

      <label for="target">NIP-98 target URL</label>
      <input id="target" />

      <label for="peer">NIP-44 peer public key hex</label>
      <input id="peer" />

      <div class="actions">
        <button id="check">Check bridge</button>
        <button id="pubkey" class="secondary">Get public key</button>
        <button id="sign-event" class="secondary">Sign Nostr event</button>
        <button id="nip44" class="secondary">NIP-44 round trip</button>
        <button id="new-window" class="secondary">Open test tab</button>
        <button id="sign">Sign NIP-98 GET</button>
      </div>

      <p>
        <a href="https://example.com/" target="_blank" rel="noreferrer">
          Target blank test link
        </a>
      </p>

      <pre id="output">Ready.</pre>
    </main>

    <script>
      const target = document.querySelector("#target");
      const peer = document.querySelector("#peer");
      const output = document.querySelector("#output");
      target.value = `${window.location.origin}/api/health`;

      function write(value) {
        output.textContent =
          typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      document.querySelector("#check").addEventListener("click", () => {
        write({
          href: window.location.href,
          origin: window.location.origin,
          hasNostr: Boolean(window.nostr),
          wingmanBridge: Boolean(window.nostr && window.nostr.__wingman),
          methods: window.nostr ? Object.keys(window.nostr) : [],
        });
      });

      document.querySelector("#pubkey").addEventListener("click", async () => {
        if (!window.nostr) {
          write("window.nostr is not available.");
          return;
        }
        try {
          write({ publicKey: await window.nostr.getPublicKey() });
        } catch (error) {
          write(String(error && error.message ? error.message : error));
        }
      });

      document.querySelector("#sign").addEventListener("click", async () => {
        if (!window.nostr || !window.nostr.signNip98) {
          write("window.nostr.signNip98 is not available.");
          return;
        }
        try {
          const authorization = await window.nostr.signNip98({
            httpMethod: "GET",
            url: target.value,
          });
          write({ authorization });
        } catch (error) {
          write(String(error && error.message ? error.message : error));
        }
      });

      document
        .querySelector("#sign-event")
        .addEventListener("click", async () => {
          if (!window.nostr || !window.nostr.signEvent) {
            write("window.nostr.signEvent is not available.");
            return;
          }
          try {
            const event = await window.nostr.signEvent({
              kind: 1,
              tags: [["client", "wingman-app"]],
              content: "Testing Nostr Browser NIP-07 signing",
            });
            write({ event });
          } catch (error) {
            write(String(error && error.message ? error.message : error));
          }
        });

      document.querySelector("#nip44").addEventListener("click", async () => {
        if (!window.nostr || !window.nostr.nip44) {
          write("window.nostr.nip44 is not available.");
          return;
        }
        try {
          const self = await window.nostr.getPublicKey();
          if (!peer.value) peer.value = self;
          const ciphertext = await window.nostr.nip44.encrypt(
            peer.value,
            "Testing Nostr Browser NIP-44 encryption",
          );
          const plaintext = await window.nostr.nip44.decrypt(
            peer.value,
            ciphertext,
          );
          write({ peer: peer.value, ciphertext, plaintext });
        } catch (error) {
          write(String(error && error.message ? error.message : error));
        }
      });

      document.querySelector("#new-window").addEventListener("click", () => {
        window.open("https://example.com/", "_blank");
        write("Requested a new Nostr Browser tab.");
      });
    </script>
  </body>
</html>
